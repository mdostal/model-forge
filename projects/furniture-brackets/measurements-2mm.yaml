# Strengthen-and-retest variant — same part as measurements.yaml (see that
# file for the full measurement-correction notes), printed at 2mm instead
# of 1.75mm, per the user's own fallback plan: "we may do one at 1.75mm or
# bring it to 2mm if we need to strengthen and test." Try measurements.yaml
# first; if it snaps or flexes too much at the hole, print this one.

face_a_length: 21.7    # measured (caliper) — see measurements.yaml
face_b_length: 26      # measured (caliper)
width: 12               # measured (caliper) — corrected from an unmeasured assumption
material_thickness: 2   # explicit strengthen-test target, not derived from native thickness
material_source: print-native
print_material: PLA

hole_diameter: 0
countersink_diameter: 0
countersink_depth: 0
hole_offset: 0

slot_length: 15.1   # measured (caliper) — see measurements.yaml
slot_width: 4.3      # measured (caliper), narrow point
slot_offset: 16.5    # still an estimate — see measurements.yaml
