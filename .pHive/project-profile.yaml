  di_framework: n/a
  state_management: "Per-project NOTES.md (measurements, approach, licensing) as source of truth"
  navigation: n/a
  data_layer: "Local filesystem: projects/<name>/reference-photos/ + NOTES.md; no raws/sliced equivalent here (that's DT Forge's job)"

conventions:
  naming: "projects/<kebab-case-project-name>/ with reference-photos/ and NOTES.md"
  file_organization: "pipeline/ for reusable tools, projects/ for individual reverse-engineering jobs, docs/ for workflow write-ups"
  branching: "Single default branch so far (1 commit at kickoff)"
  commit_messages: "Not enough history yet to establish a pattern"

