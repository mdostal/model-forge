north_star:
  goal: >
    Build the tools that make the photo/measure -> model -> print loop fast
    and repeatable, so DT Forge (dostal-3d-printing) and its future studio
    have something real to call into. Open-source as a framework/library —
    "just like any web component or framework" — with its own docs/showcase
    page, distinct from DT Forge's full product/app implementation that
    wraps model-forge's tools with a different UI (clarified at kickoff,
    2026-09-10, after initial confusion about which repo owns the UI).
  audience: >
    Solo developer (Mathew) today, time-constrained ("solo-dad time is the
    bottleneck" per ROADMAP.md); open-sourced later so other makers can
    consume the library the way they'd consume any framework.
  expected_scale: >
    Single user/solo-dev now. As an open-source library, later "scale" means
    other developers depending on it, not concurrent backend load.
  pain_points: >
    Tools must *save* setup time, not add ceremony (ROADMAP.md's own
    guiding constraint) — matches the DT Forge kickoff's AI-automation pain
    point. Immediate gap: Milestone 0 (validate the manual loop by hand)
    hasn't been completed yet — furniture-brackets has reference photos but
    the NOTES.md measurement table is still blank, and the roadmap's own
    ordering puts Milestone 1 (bracket-gen) after Milestone 0, not before it.
