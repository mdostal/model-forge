project_name: "model-forge"
project_type: framework
has_ui: true   # own docs/showcase page (framework-library pattern), separate from DT Forge's app shell — see north_star below
type: brownfield
discovered: "2026-09-10"
source: "README.md + ROADMAP.md + docs/ + projects/ + kickoff conversation"

ship_target:
  kind: github-release
  notes: "Tag a release when a milestone's tooling lands (e.g. bracket-gen for Milestone 1), matching DT Forge's convention."

claude_md_summary: |
  No CLAUDE.md yet. Ground truth is README.md + ROADMAP.md:
  - "The 3D model side of the maker stack — creating and owning models,
    separate from printing them." Sibling to (not part of) dostal-3d-printing
    (DT Forge) and drone-hub/video-utils.
  - Two lanes matched to part type: Organic (Meshy Pro -> Blender repair) for
    creatures/art; Functional (Onshape/Tinkercad parametric CAD) for
    brackets/organizers/enclosures. A third mode, reverse-engineering
    (photo-to-3D or caliper->CAD), replaces a real physical part.
  - Explicit rule: "Don't AI-generate toleranced parts." Functional/toleranced
    parts get measured and CAD'd; organic/artistic parts get generated.
  - ROADMAP.md is framed as "the Hive target" — milestones scoped as stories
    a Hive plan can pick up, ordered: M0 validate the loop by hand (no tools)
    -> M1 measure->model assist (bracket-gen) -> M2 photogrammetry glue -> M3
    Meshy->print wrapper -> M4 drone->house model.
  - Guiding constraints: own the models (personal-use downloads never enter
    the sellable path); match tool to part; solo-dad time is the bottleneck
    (tools must save setup time, not add ceremony); prefer open/free tooling
    (Onshape free tier, OpenSCAD, Blender, Meshroom) over revenue-capped
    traps (Fusion 360 free tier caps at <$1k/yr).

