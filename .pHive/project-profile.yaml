  languages: [markdown]
  frameworks: []
  build_tools: []
  package_managers: []
  versions: {}

structure:
  modules:
    - name: projects/furniture-brackets
      purpose: "First reverse-engineering job — replace worn corner-brackets. 7 reference photos captured 2026-09-08, measurement table in NOTES.md still blank (Milestone 0 not yet completed by hand)."
      source: projects/furniture-brackets/
    - name: projects/playset-bracket
      purpose: "Second reverse-engineering job, queued to run the same loop once furniture-brackets validates it. No reference photos yet."
      source: projects/playset-bracket/
    - name: pipeline
      purpose: "Tools we build (photogrammetry, mesh-repair, batch prep) — currently just a README, no code yet"
      source: pipeline/
    - name: docs
