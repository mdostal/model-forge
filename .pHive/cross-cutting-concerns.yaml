concerns:
  - id: documentation
    name: Documentation Updates
    description: >
      When a story changes user-facing behavior, workflow steps, or configuration,
      corresponding documentation must be updated.
    applies_when: >
      Story modifies workflows, schemas, directory structure, configuration files,
      or adds/removes/renames reference documents
    planning_prompt: >
      Which documentation files reference the behavior this story changes?
      List each doc and what section needs updating.
    implementation_checklist:
      - "All docs referencing changed behavior identified"
      - "Affected sections updated to reflect new behavior"
      - "No stale references to old behavior remain"
  - id: model-provenance
    name: Model Provenance & Licensing
    description: >
      Any story that produces or ingests a 3D model file must record how it
      was made (measured+CAD vs AI-generated vs photogrammetry) so
      ownership/licensing is never ambiguous later.
    applies_when: >
      Story adds model generation, CAD, or photogrammetry tooling; story
      touches projects/*/reference-photos or NOTES.md; story adds a
      pipeline/ tool that outputs an STL/3mf.
    planning_prompt: >
      Does this story produce a model file? If so, how is its provenance
      recorded (which lane: organic/functional/reverse-engineer) and where
      does the licensing note land?
    implementation_checklist:
      - "Output model's provenance (lane + method) is recorded, not just the file"
      - "Toleranced/functional parts are never routed through AI generation"
      - "NOTES.md or an equivalent record is updated for the project this touches"
